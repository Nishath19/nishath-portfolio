<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nishath Tarannum — Software Developer</title>
    <meta
      name="description"
      content="Software Developer with 5+ years building serverless backends on Node.js and AWS, and React frontends on top."
    />
    <meta name="theme-color" content="#0A0710" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="Nishath Tarannum — Software Developer" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Static shadow of the Contact form so Netlify's build-time crawler can detect and
         register it — the real form is rendered client-side by React and submitted via fetch. -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
